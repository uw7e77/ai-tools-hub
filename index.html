<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AIToolsHub — Discover, Compare &amp; Learn the Best AI Tools</title>
    <meta
      name="description"
      content="Discover, compare and learn the AI tools that actually work. Curated, tested and reviewed — trending tools, AI agents, companies and tutorials in one hub."
    />
    <!-- Placeholder domain: replace before launch -->
    <link rel="canonical" href="https://aitoolshub.example/" />
    <meta name="theme-color" content="#F8F6F1" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AIToolsHub" />
    <meta property="og:title" content="AIToolsHub — Discover, Compare & Learn the Best AI Tools" />
    <meta
      property="og:description"
      content="Discover, compare and learn the AI tools that actually work. Curated, tested and reviewed."
    />
    <meta property="og:url" content="https://aitoolshub.example/" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('aitoolshub:theme')
          var dark = t === 'dark' || (t === null && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AIToolsHub",
        "url": "https://aitoolshub.example/",
        "description": "Discover, compare and learn the AI tools that actually work.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://aitoolshub.example/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
